<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="CalmPocket is an offline ADHD-friendly paycheck and personal budget planner.">
  <link rel="manifest" href="manifest.json">
  <title>CalmPocket Budget Planner</title>
  
  <style>:root {
  --bg: #f5f7f3;
  --surface: #ffffff;
  --surface-soft: #eef3ed;
  --surface-warm: #fff8ed;
  --ink: #20312d;
  --ink-soft: #49615a;
  --muted: #7c9189;
  --line: #e1e9e2;
  --primary: #3f7466;
  --primary-deep: #2e5c50;
  --primary-soft: #dceee8;
  --lavender: #776aa9;
  --lavender-soft: #eeeafd;
  --amber: #c78836;
  --amber-soft: #fff0d9;
  --rose: #b96875;
  --rose-soft: #fbe8eb;
  --blue: #4c7f9d;
  --blue-soft: #e3f0f7;
  --shadow: 0 18px 48px rgba(50, 74, 66, 0.08);
  --shadow-small: 0 8px 24px rgba(50, 74, 66, 0.07);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

[data-theme="dark"] {
  --bg: #151d1b;
  --surface: #202b27;
  --surface-soft: #263630;
  --surface-warm: #342b20;
  --ink: #edf4ef;
  --ink-soft: #b8c9c1;
  --muted: #8fa69c;
  --line: #34463f;
  --primary: #8dc7b5;
  --primary-deep: #b7e2d3;
  --primary-soft: #24453b;
  --lavender: #b7a9ef;
  --lavender-soft: #332e50;
  --amber: #efbd70;
  --amber-soft: #4a3820;
  --rose: #e1a1ad;
  --rose-soft: #4a2e35;
  --blue: #9bc8e5;
  --blue-soft: #263e4b;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
  --shadow-small: 0 8px 24px rgba(0, 0, 0, 0.16);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(76, 127, 157, 0.28);
  outline-offset: 2px;
}

a {
  color: inherit;
}

.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--bg);
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex: 0 0 270px;
  flex-direction: column;
  width: 270px;
  height: 100vh;
  padding: 26px 16px 18px;
  border-right: 1px solid var(--line);
  background: var(--surface);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 10px 24px;
}

.brand-mark {
  display: grid;
  width: 39px;
  height: 39px;
  flex: 0 0 39px;
  place-items: center;
  border-radius: 13px;
  background: var(--primary);
  color: #fff;
  font-size: 21px;
  box-shadow: 0 8px 20px rgba(63, 116, 102, 0.22);
}

.brand-name {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-caption {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sidebar-close {
  display: none;
  margin-left: auto;
}

.profile-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 4px 26px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-soft);
}

.avatar {
  display: grid;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  place-items: center;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
}

.profile-copy {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 2px;
}

.profile-copy strong {
  overflow: hidden;
  color: var(--ink);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile-copy span {
  color: var(--muted);
  font-size: 10px;
}

.status-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
  background: #64b58f;
  box-shadow: 0 0 0 4px rgba(100, 181, 143, 0.12);
}

.nav-label {
  padding: 0 12px 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  padding-right: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 43px;
  padding: 10px 12px;
  border-radius: 13px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 700;
  text-align: left;
  transition: background 160ms ease, color 160ms ease, transform 160ms ease;
}

.nav-item:hover {
  background: var(--surface-soft);
  color: var(--ink);
  transform: translateX(2px);
}

.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.nav-icon {
  display: grid;
  width: 20px;
  flex: 0 0 20px;
  place-items: center;
  font-size: 16px;
  line-height: 1;
}

.nav-badge {
  min-width: 19px;
  margin-left: auto;
  padding: 2px 6px;
  border-radius: 20px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 9px;
  font-weight: 800;
  text-align: center;
}

.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: auto;
}

.privacy-card {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface-warm);
}

.privacy-icon {
  display: grid;
  width: 23px;
  height: 23px;
  flex: 0 0 23px;
  place-items: center;
  border-radius: 8px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 16px;
}

.privacy-card div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.privacy-card strong {
  font-size: 10px;
}

.privacy-card span {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.nav-settings {
  min-height: 38px;
}

.main-content {
  min-width: 0;
  flex: 1;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  max-width: 1420px;
  margin: 0 auto;
  padding: 29px 44px 18px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.topbar h1 {
  margin: 4px 0 0;
  color: var(--ink);
  font-size: clamp(23px, 2.5vw, 31px);
  font-weight: 800;
  letter-spacing: -0.045em;
}

.eyebrow {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-button {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-soft);
  color: var(--ink-soft);
  font-size: 18px;
  transition: background 160ms ease, color 160ms ease;
}

.icon-button:hover {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.menu-toggle {
  display: none;
}

.soft-button,
.primary-button,
.secondary-button,
.danger-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 38px;
  padding: 9px 14px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 800;
  transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

.soft-button:hover,
.primary-button:hover,
.secondary-button:hover,
.danger-button:hover {
  transform: translateY(-1px);
}

.soft-button {
  background: var(--surface);
  color: var(--ink-soft);
  box-shadow: var(--shadow-small);
}

.soft-button:hover {
  color: var(--primary-deep);
}

.primary-button {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 8px 18px rgba(63, 116, 102, 0.2);
}

.primary-button:hover {
  background: var(--primary-deep);
  box-shadow: 0 11px 22px rgba(63, 116, 102, 0.25);
}

.secondary-button {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.danger-button {
  background: var(--rose-soft);
  color: var(--rose);
}

.circle-add {
  display: grid;
  width: 39px;
  height: 39px;
  place-items: center;
  border-radius: 13px;
  background: var(--primary);
  color: #fff;
  font-size: 23px;
  line-height: 1;
  box-shadow: 0 8px 18px rgba(63, 116, 102, 0.25);
  transition: transform 160ms ease;
}

.circle-add:hover {
  transform: rotate(7deg) scale(1.04);
}

.app-view {
  max-width: 1420px;
  margin: 0 auto;
  padding: 0 44px 50px;
}

.view-intro {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin: 5px 0 22px;
}

.view-intro h2 {
  margin: 0;
  color: var(--ink);
  font-size: 20px;
  letter-spacing: -0.03em;
}

.view-intro p {
  max-width: 620px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.view-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
  gap: 18px;
}

.hero-card {
  position: relative;
  min-height: 298px;
  overflow: hidden;
  padding: 28px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, #365f55 0%, #497c6c 58%, #79ac97 100%);
  color: #fff;
  box-shadow: 0 20px 45px rgba(47, 94, 80, 0.23);
}

.hero-card::after {
  position: absolute;
  right: -85px;
  bottom: -115px;
  width: 330px;
  height: 330px;
  border: 1px solid rgba(255, 255, 255, 0.19);
  border-radius: 50%;
  box-shadow: 0 0 0 28px rgba(255, 255, 255, 0.04), 0 0 0 58px rgba(255, 255, 255, 0.03);
  content: "";
}

.hero-card > * {
  position: relative;
  z-index: 1;
}

.hero-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.hero-kicker {
  margin-bottom: 10px;
  color: rgba(255, 255, 255, 0.77);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hero-card h2 {
  max-width: 380px;
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.hero-number {
  margin: 12px 0 3px;
  font-size: clamp(46px, 6vw, 76px);
  font-weight: 850;
  letter-spacing: -0.09em;
  line-height: 0.98;
}

.hero-note {
  color: rgba(255, 255, 255, 0.75);
  font-size: 11px;
}

.hero-info {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.hero-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-top: 30px;
}

.hero-subnumber {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hero-subnumber span {
  color: rgba(255, 255, 255, 0.68);
  font-size: 10px;
}

.hero-subnumber strong {
  font-size: 19px;
}

.hero-bar {
  width: min(250px, 100%);
}

.hero-bar-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: rgba(255, 255, 255, 0.72);
  font-size: 10px;
}

.bar-track {
  height: 7px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.2);
}

.bar-fill {
  height: 100%;
  border-radius: inherit;
  background: #f7d9a4;
}

.attention-card {
  min-height: 298px;
  padding: 23px;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}

.card-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 17px;
}

.card-title-row h3,
.content-card h3 {
  margin: 0;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: -0.02em;
}

.card-title-row a,
.text-button {
  padding: 0;
  background: transparent;
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
}

.attention-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.attention-item {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 52px;
  padding: 9px 10px;
  border-radius: 13px;
  background: var(--surface-soft);
}

.attention-icon {
  display: grid;
  width: 31px;
  height: 31px;
  flex: 0 0 31px;
  place-items: center;
  border-radius: 11px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 15px;
}

.attention-copy {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 3px;
}

.attention-copy strong {
  overflow: hidden;
  color: var(--ink);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.attention-copy span {
  color: var(--muted);
  font-size: 10px;
}

.attention-arrow {
  color: var(--muted);
  font-size: 16px;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin-top: 18px;
}

.metric-card {
  min-height: 105px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.metric-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
}

.metric-icon {
  display: grid;
  width: 25px;
  height: 25px;
  place-items: center;
  border-radius: 9px;
  font-size: 13px;
}

.metric-icon.green {
  background: var(--primary-soft);
  color: var(--primary);
}

.metric-icon.orange {
  background: var(--amber-soft);
  color: var(--amber);
}

.metric-icon.purple {
  background: var(--lavender-soft);
  color: var(--lavender);
}

.metric-icon.blue {
  background: var(--blue-soft);
  color: var(--blue);
}

.metric-icon.rose {
  background: var(--rose-soft);
  color: var(--rose);
}

.metric-value {
  display: block;
  margin-top: 15px;
  color: var(--ink);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.05em;
}

.metric-foot {
  margin-top: 4px;
  color: var(--muted);
  font-size: 9px;
}

.two-column {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.82fr);
  gap: 18px;
  margin-top: 18px;
}

.content-card {
  min-width: 0;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: 27px 0 13px;
}

.section-heading h3 {
  margin: 0;
  color: var(--ink);
  font-size: 15px;
  letter-spacing: -0.025em;
}

.section-heading p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 10px;
}

.quick-add-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.quick-chip {
  min-width: 56px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface-soft);
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 800;
  transition: border 160ms ease, background 160ms ease, transform 160ms ease;
}

.quick-chip:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary-deep);
  transform: translateY(-1px);
}

.transaction-list,
.entity-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.list-item:last-child {
  border-bottom: 0;
}

.list-icon {
  display: grid;
  width: 35px;
  height: 35px;
  flex: 0 0 35px;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-soft);
  font-size: 16px;
}

.list-main {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 3px;
}

.list-main strong {
  overflow: hidden;
  color: var(--ink);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-main span {
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-amount {
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.list-amount.income {
  color: var(--primary);
}

.list-amount.expense {
  color: var(--rose);
}

.list-actions {
  display: flex;
  gap: 5px;
  margin-left: 4px;
}

.mini-action {
  display: grid;
  width: 27px;
  height: 27px;
  place-items: center;
  border-radius: 9px;
  background: var(--surface-soft);
  color: var(--muted);
  font-size: 12px;
}

.mini-action:hover {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 115px;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 15px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.gentle-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  padding: 14px 16px;
  border: 1px solid #ecd9b5;
  border-radius: 17px;
  background: var(--surface-warm);
}

.gentle-banner-icon {
  display: grid;
  width: 33px;
  height: 33px;
  flex: 0 0 33px;
  place-items: center;
  border-radius: 11px;
  background: var(--amber-soft);
  color: var(--amber);
  font-size: 16px;
}

.gentle-banner-copy {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 3px;
}

.gentle-banner-copy strong {
  font-size: 11px;
}

.gentle-banner-copy span {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.table-wrap {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 620px;
  border-collapse: collapse;
}

.data-table th {
  padding: 0 11px 11px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-align: left;
  text-transform: uppercase;
}

.data-table td {
  padding: 13px 11px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 11px;
  vertical-align: middle;
}

.data-table td strong {
  color: var(--ink);
  font-size: 11px;
}

.data-table tr:hover td {
  background: var(--surface-soft);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 800;
  white-space: nowrap;
}

.badge.green {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.badge.amber {
  background: var(--amber-soft);
  color: var(--amber);
}

.badge.rose {
  background: var(--rose-soft);
  color: var(--rose);
}

.badge.blue {
  background: var(--blue-soft);
  color: var(--blue);
}

.badge.gray {
  background: var(--surface-soft);
  color: var(--muted);
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 150px;
}

.progress-track {
  height: 7px;
  flex: 1;
  overflow: hidden;
  border-radius: 20px;
  background: var(--surface-soft);
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
}

.progress-fill.purple {
  background: var(--lavender);
}

.progress-fill.amber {
  background: var(--amber);
}

.progress-fill.rose {
  background: var(--rose);
}

.progress-row span {
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
}

.paycheck-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
  gap: 18px;
}

.paycheck-hero {
  padding: 25px;
  border-radius: var(--radius-xl);
  background: linear-gradient(140deg, #f1eafd, #fff 60%);
  box-shadow: var(--shadow-small);
}

[data-theme="dark"] .paycheck-hero {
  background: linear-gradient(140deg, #332e50, var(--surface) 60%);
}

.paycheck-hero .kicker {
  color: var(--lavender);
}

.paycheck-hero h2 {
  max-width: 470px;
  margin: 8px 0 16px;
  color: var(--ink);
  font-size: clamp(24px, 3vw, 37px);
  letter-spacing: -0.06em;
  line-height: 1.05;
}

.kicker {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.allocation-stack {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 24px;
}

.allocation-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--ink-soft);
  font-size: 11px;
}

.allocation-line strong {
  color: var(--ink);
}

.allocation-line.total {
  margin-top: 5px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  color: var(--primary-deep);
  font-weight: 800;
}

.paycheck-next {
  padding: 23px;
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-small);
}

.next-payday-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  padding: 13px;
  border-radius: 15px;
  background: var(--surface-soft);
}

.date-tile {
  display: grid;
  width: 45px;
  height: 45px;
  flex: 0 0 45px;
  place-items: center;
  border-radius: 13px;
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  text-align: center;
  text-transform: uppercase;
}

.date-tile strong {
  display: block;
  font-size: 17px;
  line-height: 1;
}

.next-payday-card div:last-child {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.next-payday-card strong {
  font-size: 12px;
}

.next-payday-card span {
  color: var(--muted);
  font-size: 10px;
}

.paycheck-mini-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.paycheck-mini {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.paycheck-mini:last-child {
  border-bottom: 0;
}

.paycheck-mini strong {
  font-size: 11px;
}

.paycheck-mini span {
  color: var(--muted);
  font-size: 10px;
}

.paycheck-mini-amount {
  color: var(--primary-deep);
  font-size: 12px;
  font-weight: 800;
}

.calendar-card {
  padding: 21px;
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}

.calendar-head h2 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.04em;
}

.calendar-actions {
  display: flex;
  gap: 5px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}

.weekday {
  padding: 0 3px 7px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  text-align: center;
  text-transform: uppercase;
}

.calendar-day {
  position: relative;
  min-height: 82px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}

.calendar-day.muted {
  opacity: 0.42;
}

.calendar-day.today {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-soft);
}

.calendar-day-number {
  display: inline-grid;
  width: 22px;
  height: 22px;
  place-items: center;
  border-radius: 8px;
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 800;
}

.calendar-day.today .calendar-day-number {
  background: var(--primary);
  color: #fff;
}

.calendar-events {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 6px;
}

.calendar-event {
  overflow: hidden;
  padding: 3px 5px;
  border-radius: 5px;
  background: var(--surface-soft);
  color: var(--ink-soft);
  font-size: 8px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calendar-event.income {
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.calendar-event.bill {
  background: var(--amber-soft);
  color: var(--amber);
}

.calendar-event.expense {
  background: var(--rose-soft);
  color: var(--rose);
}

.calendar-event.goal {
  background: var(--lavender-soft);
  color: var(--lavender);
}

.review-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.review-stat {
  padding: 17px;
  border-radius: 17px;
  background: var(--surface-soft);
}

.review-stat span {
  color: var(--muted);
  font-size: 10px;
}

.review-stat strong {
  display: block;
  margin-top: 8px;
  color: var(--ink);
  font-size: 23px;
  letter-spacing: -0.05em;
}

.review-stat small {
  display: block;
  margin-top: 3px;
  color: var(--primary);
  font-size: 9px;
  font-weight: 800;
}

.category-bars {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.category-bar-row {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.category-bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--ink-soft);
  font-size: 10px;
}

.category-bar-label strong {
  color: var(--ink);
}

.category-bar-track {
  height: 8px;
  overflow: hidden;
  border-radius: 20px;
  background: var(--surface-soft);
}

.category-bar-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
}

.category-bar-fill.rose {
  background: var(--rose);
}

.category-bar-fill.amber {
  background: var(--amber);
}

.category-bar-fill.purple {
  background: var(--lavender);
}

.category-bar-fill.blue {
  background: var(--blue);
}

.settings-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(270px, 0.7fr);
  gap: 18px;
}

.settings-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.setting-copy strong {
  font-size: 11px;
}

.setting-copy span {
  max-width: 430px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.segmented {
  display: inline-flex;
  padding: 3px;
  border-radius: 11px;
  background: var(--surface-soft);
}

.segment {
  padding: 7px 9px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

.segment.active {
  background: var(--surface);
  color: var(--primary-deep);
  box-shadow: var(--shadow-small);
}

.form-control {
  width: 100%;
  min-height: 40px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: 0;
  background: var(--surface);
  color: var(--ink);
  font-size: 11px;
}

.form-control::placeholder {
  color: #a2b0aa;
}

textarea.form-control {
  min-height: 92px;
  resize: vertical;
}

.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field label {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 800;
}

.field small {
  color: var(--muted);
  font-size: 9px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.form-grid .full {
  grid-column: 1 / -1;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.checkbox-line {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-top: 13px;
  color: var(--ink-soft);
  font-size: 10px;
  cursor: pointer;
}

.checkbox-line input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--primary);
}

.checkbox-line span {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.checkbox-line strong {
  color: var(--ink);
  font-size: 10px;
}

.checkbox-line small {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.4;
}

.modal-backdrop {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: grid;
  padding: 20px;
  place-items: center;
  background: rgba(29, 44, 39, 0.42);
  backdrop-filter: blur(8px);
}

.modal-card {
  width: min(620px, 100%);
  max-height: min(90vh, 780px);
  overflow: auto;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: var(--surface);
  box-shadow: 0 25px 80px rgba(20, 35, 30, 0.22);
}

.modal-card.narrow {
  width: min(450px, 100%);
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  color: var(--ink);
  font-size: 19px;
  letter-spacing: -0.04em;
}

.modal-header p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.modal-close {
  display: grid;
  width: 31px;
  height: 31px;
  flex: 0 0 31px;
  place-items: center;
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--muted);
  font-size: 17px;
}

.modal-close:hover {
  background: var(--rose-soft);
  color: var(--rose);
}

.formula-card {
  padding: 16px;
  border-radius: 15px;
  background: var(--surface-soft);
}

.formula-line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 0;
  color: var(--ink-soft);
  font-size: 11px;
}

.formula-line + .formula-line {
  border-top: 1px solid var(--line);
}

.formula-line strong {
  color: var(--ink);
  text-align: right;
}

.formula-total {
  margin-top: 10px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  color: var(--primary-deep);
  font-size: 13px;
  font-weight: 800;
}

.toast-stack {
  position: fixed;
  z-index: 120;
  right: 20px;
  bottom: 20px;
  display: flex;
  max-width: min(360px, calc(100vw - 40px));
  flex-direction: column;
  gap: 8px;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  font-size: 11px;
  font-weight: 700;
  animation: toast-in 220ms ease both;
}

.toast-icon {
  display: grid;
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  place-items: center;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary-deep);
}

.toast.warning .toast-icon {
  background: var(--amber-soft);
  color: var(--amber);
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.focus-overlay {
  position: fixed;
  z-index: 90;
  inset: 0;
  display: grid;
  padding: 24px;
  place-items: center;
  background: rgba(26, 48, 41, 0.92);
}

.focus-box {
  width: min(580px, 100%);
  padding: clamp(28px, 6vw, 68px);
  border-radius: 32px;
  background: var(--surface);
  text-align: center;
  box-shadow: 0 30px 100px rgba(0, 0, 0, 0.25);
}

.focus-box .focus-symbol {
  display: grid;
  width: 55px;
  height: 55px;
  margin: 0 auto 20px;
  place-items: center;
  border-radius: 18px;
  background: var(--primary-soft);
  color: var(--primary-deep);
  font-size: 26px;
}

.focus-box h2 {
  margin: 0;
  color: var(--ink);
  font-size: 21px;
  letter-spacing: -0.04em;
}

.focus-number {
  margin: 16px 0 8px;
  color: var(--primary-deep);
  font-size: clamp(55px, 13vw, 110px);
  font-weight: 850;
  letter-spacing: -0.1em;
  line-height: 0.95;
}

.focus-box p {
  margin: 0 auto 25px;
  color: var(--muted);
  font-size: 11px;
}

.start-card {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
  gap: 25px;
  align-items: center;
  padding: 30px;
  border-radius: var(--radius-xl);
  background: linear-gradient(135deg, var(--primary-soft), var(--surface));
  box-shadow: var(--shadow-small);
}

.start-card h2 {
  max-width: 530px;
  margin: 8px 0 10px;
  color: var(--ink);
  font-size: clamp(25px, 4vw, 44px);
  letter-spacing: -0.07em;
  line-height: 1.03;
}

.start-card p {
  max-width: 510px;
  margin: 0;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 1.6;
}

.start-points {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.start-point {
  padding: 13px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.64);
}

[data-theme="dark"] .start-point {
  background: rgba(32, 43, 39, 0.72);
}

.start-point strong {
  display: block;
  color: var(--ink);
  font-size: 11px;
}

.start-point span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.4;
}

.setup-steps {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.setup-step {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px;
  border-radius: 13px;
  background: var(--surface-soft);
}

.setup-step-number {
  display: grid;
  width: 25px;
  height: 25px;
  flex: 0 0 25px;
  place-items: center;
  border-radius: 9px;
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
}

.setup-step strong {
  display: block;
  font-size: 11px;
}

.setup-step span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

.milestone {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  border-radius: 16px;
  background: var(--lavender-soft);
}

.milestone-icon {
  display: grid;
  width: 37px;
  height: 37px;
  flex: 0 0 37px;
  place-items: center;
  border-radius: 13px;
  background: var(--lavender);
  color: #fff;
  font-size: 18px;
}

.milestone strong {
  display: block;
  color: var(--ink);
  font-size: 11px;
}

.milestone span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
}

.pill-tabs {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border-radius: 13px;
  background: var(--surface-soft);
}

.pill-tab {
  padding: 8px 11px;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

.pill-tab.active {
  background: var(--surface);
  color: var(--primary-deep);
  box-shadow: var(--shadow-small);
}

.stack-gap {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.subtle-note {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.text-right {
  text-align: right;
}

.nowrap {
  white-space: nowrap;
}

.hidden {
  display: none !important;
}

@media (max-width: 1100px) {
  .sidebar {
    flex-basis: 240px;
    width: 240px;
  }

  .topbar,
  .app-view {
    padding-right: 26px;
    padding-left: 26px;
  }

  .dashboard-grid,
  .paycheck-layout,
  .settings-grid {
    grid-template-columns: 1fr;
  }

  .hero-card,
  .attention-card {
    min-height: auto;
  }
}

@media (max-width: 820px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 80;
    width: min(290px, 88vw);
    transform: translateX(-105%);
    transition: transform 220ms ease;
    box-shadow: 18px 0 55px rgba(27, 42, 36, 0.18);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close,
  .menu-toggle {
    display: grid;
  }

  .menu-toggle {
    flex: 0 0 36px;
  }

  .topbar {
    padding-top: 18px;
  }

  .topbar-actions .soft-button {
    padding-right: 10px;
    padding-left: 10px;
  }

  .metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .two-column,
  .start-card {
    grid-template-columns: 1fr;
  }

  .calendar-day {
    min-height: 68px;
    padding: 5px;
  }

  .calendar-events {
    gap: 2px;
  }

  .calendar-event {
    max-width: 100%;
    padding: 2px 3px;
    font-size: 7px;
  }
}

@media (max-width: 560px) {
  .topbar,
  .app-view {
    padding-right: 15px;
    padding-left: 15px;
  }

  .topbar {
    gap: 10px;
    padding-top: 15px;
    padding-bottom: 15px;
  }

  .topbar h1 {
    font-size: 23px;
  }

  .eyebrow {
    max-width: 190px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topbar-actions .soft-button {
    width: 36px;
    padding: 0;
    font-size: 0;
  }

  .topbar-actions .soft-button span {
    font-size: 15px;
  }

  .circle-add {
    width: 36px;
    height: 36px;
  }

  .view-intro {
    align-items: flex-start;
    flex-direction: column;
  }

  .hero-card,
  .attention-card,
  .content-card,
  .paycheck-hero,
  .paycheck-next,
  .start-card {
    padding: 20px;
    border-radius: 21px;
  }

  .hero-card {
    min-height: 270px;
  }

  .hero-number {
    font-size: 56px;
  }

  .hero-footer {
    margin-top: 24px;
  }

  .metric-card {
    min-height: 93px;
    padding: 13px;
  }

  .metric-value {
    margin-top: 12px;
    font-size: 19px;
  }

  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
  }

  .form-grid,
  .review-grid,
  .start-points {

  function uid(prefix) {

    var a = parseDate(from);

  function defaultState() {

  function mergeState(saved) {
    var base = defaultState();
    if (!saved || typeof saved !== "object") return base;
    Object.keys(base).forEach(function (key) {
      if (saved[key] !== undefined) base[key] = saved[key];
    });
    base.profile = Object.assign(defaultState().profile, saved.profile || {});
    base.ui = Object.assign(defaultState().ui, saved.ui || {});
    ["accounts", "paychecks", "bills", "expenses", "envelopes", "goals", "debts", "brainDump", "impulses"].forEach(function (key) {
      if (!Array.isArray(base[key])) base[key] = [];
    });
    if (!base.reviewNotes || typeof base.reviewNotes !== "object") base.reviewNotes = {};
    return base;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(APP_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        // Version 1 opened with demo numbers. Do not silently carry that demo
        // data into the new empty-first experience.
        if (saved && saved.version === 1 && saved.profile && saved.profile.sampleMode) {

        return mergeState(saved);

      console.warn("Could not load local state", error);
    }

  function saveState() {
    state.lastSaved = new Date().toISOString();

      localStorage.setItem(APP_KEY, JSON.stringify(state));

  function saveIndexedDB() {

        if (!event.target.result.objectStoreNames.contains(DB_STORE)) {

      request.onsuccess = function (event) {
        var db = event.target.result;
        try {

  function paycheckDate(paycheck) {

    return isoDate(addDays(paycheck.date, -Math.max(0, num(paycheck.earlyPayDays))));

  function nextPayday() {

    var buffer = num(state.profile.safetyBuffer);
    var safeUntil = balance + incoming - bills - envelopes - goals - debt - buffer;
    var safeToday = Math.max(0, safeUntil / days);

      paydayDate: paydayDate,
      days: days,
      balance: balance,
      incoming: incoming,

  function advancePayday(date, frequency) {
    if (frequency === "weekly") return addDays(date, 7);
    if (frequency === "biweekly") return addDays(date, 14);
    if (frequency === "semimonthly") {
      var semi = parseDate(date);
      if (semi.getDate() < 15) semi.setDate(15);
      else semi = new Date(semi.getFullYear(), semi.getMonth() + 1, 1);
      return semi;
    }
    if (frequency === "monthly") return addMonths(date, 1);
    return addDays(date, 14);
  }

  function upcomingPaychecks(limit) {
    var today = todayISO();
    var source = state.paychecks.filter(function (paycheck) {
      return paycheckDate(paycheck) >= today && paycheck.status !== "cancelled";
    }).sort(function (a, b) { return paycheckDate(a).localeCompare(paycheckDate(b)); });
    var result = source.slice(0, limit || 6);
    var frequency = state.profile.payFrequency || "biweekly";
    var base = result.length ? result[result.length - 1] : {
      date: state.profile.nextPayday || today,
      amount: 0,
      expected: 0,
      name: "Next paycheck",
      source: "Income",
      frequency: frequency
    };
    while (result.length < (limit || 6) && frequency !== "irregular") {
      var nextDate = isoDate(advancePayday(base.date, frequency));
      var already = result.some(function (item) { return item.date === nextDate; });
      if (!already) {
        base = Object.assign({}, base, {
          id: uid("generated-pay"),
          date: nextDate,
          frequency: frequency,
          status: "upcoming",
          actual: 0,
          earlyPayDays: base.earlyPayDays || 0
        });
        result.push(base);
      } else {
        base.date = nextDate;
      }
    }
    return result.slice(0, limit || 6);
  }

  function threePaycheckMonth() {
    var paychecks = upcomingPaychecks(8);
    var counts = {};
    paychecks.forEach(function (paycheck) {
      var key = paycheckDate(paycheck).slice(0, 7);
      counts[key] = (counts[key] || 0) + 1;
    });
    return Object.keys(counts).find(function (key) { return counts[key] >= 3; }) || "";
  }

  function paycheckAllocation(paycheck) {
    var arrival = paycheckDate(paycheck);
    var candidates = upcomingPaychecks(8).filter(function (item) { return paycheckDate(item) > arrival; });
    var nextDate = candidates.length ? paycheckDate(candidates[0]) : isoDate(advancePayday(paycheck.date || arrival, paycheck.frequency || state.profile.payFrequency));
    var bills = sum(state.bills.filter(function (bill) { return !bill.paid && bill.dueDate > arrival && bill.dueDate <= nextDate; }), function (bill) { return bill.amount; });
    var goals = sum(state.goals, function (goal) { return goal.perPaycheck; });
    var envelopes = sum(state.envelopes, function (envelope) { return envelope.reserved; });
    var debt = sum(state.debts.filter(function (item) { return item.dueDate && item.dueDate > arrival && item.dueDate <= nextDate; }), function (item) { return num(item.minimum) + num(item.extra); });
    var buffer = num(state.profile.safetyBuffer);
    var afterEssentials = valueOfPaycheck(paycheck) - bills - debt;
    var remaining = afterEssentials - goals - envelopes - buffer;
    var flexible = num(paycheck.flexibleAmount) > 0 ? Math.min(num(paycheck.flexibleAmount), Math.max(0, remaining)) : Math.max(0, remaining);
    var unassigned = Math.max(0, remaining - flexible);
    return { arrival: arrival, nextDate: nextDate, amount: valueOfPaycheck(paycheck), bills: bills, goals: goals, envelopes: envelopes, debt: debt, buffer: buffer, afterEssentials: afterEssentials, flexible: flexible, unassigned: unassigned, safe: remaining };
  }

      "<div class='table-wrap'><table class='data-table'><thead><tr><th>Payday</th><th>Source</th><th>Expected</th><th>Actual</th><th>Status</th><th></th></tr></thead><tbody>" +

    html += "<div class='two-column'><section class='content-card'><div class='card-title-row'><h3>Payday checklist</h3><span class='badge purple'>repeatable</span></div><div class='setup-steps'>" +
      "<div class='setup-step'><div class='setup-step-number'>1</div><div><strong>Log what actually arrived</strong><span>Expected and actual amounts can be different. The plan can change gently.</span></div></div>" +

  function billStatus(bill) {
    if (bill.paid) return { label: "Paid", className: "green" };
    var days = dateDiff(todayISO(), bill.dueDate);
    if (days < 0) return { label: "Needs review", className: "rose" };
    if (days <= 7) return { label: days === 0 ? "Due today" : "Due soon", className: "amber" };
    return { label: "Scheduled", className: "gray" };
  }

  function renderBills() {
    var bills = state.bills.slice().sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); });
    var dueSoon = upcomingBills(7);
    var monthTotal = sum(state.bills.filter(function (bill) { return bill.frequency === "monthly"; }), function (bill) { return bill.amount; });
    var html = viewIntro(
      "Keep bills visible before they become urgent",
      "Recurring, annual, one-time, and irregular bills can all live in one calm list.",
      "Add bill",
      "add-bill"
    );
    html += "<div class='metric-grid'>" +
      miniMetric("Due in 7 days", formatMoney(sum(dueSoon, function (item) { return item.amount; })), "✓", "orange", dueSoon.length + " bill" + (dueSoon.length === 1 ? "" : "s")) +
      miniMetric("Monthly recurring", formatMoney(monthTotal), "↻", "blue", "before flexible spending") +
      miniMetric("Needs review", String(state.bills.filter(function (bill) { return !bill.paid && dateDiff(todayISO(), bill.dueDate) < 0; }).length), "!", "rose", "overdue or missed") +
      miniMetric("Paid this month", String(state.bills.filter(function (bill) { return bill.paid && bill.dueDate.slice(0, 7) === todayISO().slice(0, 7); }).length), "✦", "green", "small wins count") +
      "</div>";

    html += "<section class='content-card' style='margin-top:18px'><div class='card-title-row'><div><h3>Must-pays</h3><p class='subtle-note' style='margin:5px 0 0'>Mark a bill paid once and it leaves today’s attention list.</p></div><button class='text-button' data-action='add-bill'>＋ Add another</button></div>" +
      "<div class='table-wrap'><table class='data-table'><thead><tr><th>Bill</th><th>Due</th><th>Frequency</th><th>Amount</th><th>Account</th><th>Status</th><th></th></tr></thead><tbody>" +
      (bills.length ? bills.map(function (bill) {
        var status = billStatus(bill);
        return "<tr><td><strong>" + esc(bill.name) + "</strong><br><span class='subtle-note'>" + (bill.autopay ? "Autopay" : "Manual payment") + (bill.setAside ? " · set-aside enabled" : "") + "</span></td>" +
          "<td>" + formatDate(bill.dueDate, { month: "short", day: "numeric", year: "numeric" }) + "</td><td>" + esc(frequencyLabel(bill.frequency)) + "</td><td><strong>" + formatMoney(bill.amount) + "</strong></td>" +
          "<td>" + esc(accountName(bill.accountId)) + "</td><td><span class='badge " + status.className + "'>" + status.label + "</span></td><td class='text-right'>" +
          "<div class='list-actions'><button class='mini-action' data-action='" + (bill.paid ? "unpay-bill" : "pay-bill") + "' data-id='" + bill.id + "' title='" + (bill.paid ? "Mark unpaid" : "Mark paid") + "'>" + (bill.paid ? "↶" : "✓") + "</button>" +
          "<button class='mini-action' data-action='edit-bill' data-id='" + bill.id + "' title='Edit'>✎</button><button class='mini-action' data-action='delete-bill' data-id='" + bill.id + "' title='Delete'>×</button></div></td></tr>";
      }).join("") : "<tr><td colspan='7'>" + emptyState("Your bill list is empty. Add the next bill you expect.") + "</td></tr>") +
      "</tbody></table></div></section>";

    html += "<div class='two-column'><section class='content-card'><div class='card-title-row'><h3>Bill rhythm</h3><span class='badge blue'>flexible</span></div><p class='subtle-note'>Choose the frequency that matches real life. A quarterly bill should not look like a monthly surprise.</p><div class='category-bars' style='margin-top:17px'>" +
      ["monthly", "weekly", "biweekly", "quarterly", "annual", "once"].map(function (frequency) {
        var count = state.bills.filter(function (bill) { return bill.frequency === frequency; }).length;

      }).join("") + "</div></section>" +
      "<section class='content-card'><div class='card-title-row'><h3>Helpful reminder</h3><span class='badge amber'>gentle</span></div><div class='milestone'><div class='milestone-icon' style='background:var(--amber)'>✓</div><div><strong>Make annual bills boring</strong><span>Turn on a monthly set-aside for insurance, renewals, gifts, and other bills that arrive in one large lump.</span></div></div></section></div>";

    html += "<div class='two-column'><section class='content-card'><div class='card-title-row'><div><h3>Spending log</h3><p class='subtle-note' style='margin:5px 0 0'>Edit or remove anything. This is information, not a score.</p></div><span class='badge gray'>" + expenses.length + " total</span></div>" +

  function renderBrain() {
    var openItems = state.brainDump.filter(function (item) { return !item.done; }).sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });

    var impulses = state.impulses.slice().sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
    var html = viewIntro(
      "A safe place for unfinished money thoughts",
      "Capture first. Sort when you have the attention for it. A messy note is better than a hidden worry.",
      "Add thought",
      "add-brain"
    );
    html += "<div class='two-column'><section class='content-card'><div class='card-title-row'><div><h3>Brain dump</h3><p class='subtle-note' style='margin:5px 0 0'>Uncategorized purchases, reminders, questions, and ideas.</p></div><span class='badge purple'>" + openItems.length + " open</span></div>" +
      "<form data-form='brain' class='stack-gap'><div class='field'><label for='brainText'>What is on your mind?</label><textarea class='form-control' id='brainText' name='text' placeholder='Write it exactly as it comes...' required></textarea></div><div class='form-actions'><button class='primary-button' type='submit'>Save thought</button></div></form>" +
      "<div class='section-heading'><div><h3>Open items</h3><p>Come back when you are ready.</p></div></div>" +
      (openItems.length ? "<div class='entity-list'>" + openItems.map(function (item) {
        return "<div class='list-item'><div class='list-icon'>✎</div><div class='list-main'><strong>" + esc(item.text) + "</strong><span>Added " + formatDate(item.createdAt) + "</span></div><div class='list-actions'><button class='mini-action' data-action='resolve-brain' data-id='" + item.id + "' title='Turn into expense'>↗</button><button class='mini-action' data-action='done-brain' data-id='" + item.id + "' title='Mark done'>✓</button><button class='mini-action' data-action='delete-brain' data-id='" + item.id + "' title='Delete'>×</button></div></div>";
      }).join("") + "</div>" : emptyState("Nothing waiting here. That is a lovely kind of empty.")) +
      (doneItems.length ? "<div class='section-heading'><div><h3>Recently closed</h3><p>Finished is enough; no streak required.</p></div></div><div class='entity-list'>" + doneItems.slice(0, 4).map(function (item) {
        return "<div class='list-item'><div class='list-icon'>✓</div><div class='list-main'><strong>" + esc(item.text) + "</strong><span>Done · " + formatDate(item.createdAt) + "</span></div><button class='mini-action' data-action='delete-brain' data-id='" + item.id + "' title='Delete'>×</button></div>";
      }).join("") + "</div>" : "") +
      "</section><section class='content-card'><div class='card-title-row'><div><h3>Impulse pause</h3><p class='subtle-note' style='margin:5px 0 0'>Give a want 24 or 48 hours before deciding.</p></div><button class='text-button' data-action='add-impulse'>＋ Add want</button></div>" +
      (impulses.length ? "<div class='entity-list'>" + impulses.map(function (item) {

      }).join("") + "</div>" : emptyState("No impulse purchases waiting. Add one when you want a pause, not a lecture.", "Add a want", "add-impulse")) +
      "<div class='milestone' style='margin-top:20px'><div class='milestone-icon'>◌</div><div><strong>There is no wrong time to pause</strong><span>A pause is information. You can still buy the thing after the wait.</span></div></div></section></div>";
    return html;
  }

  function renderEnvelopes() {

    );
    html += "<div class='metric-grid'>" + miniMetric("Saved so far", formatMoney(saved), "◎", "green", goals.length + " goal" + (goals.length === 1 ? "" : "s")) + miniMetric("Target total", formatMoney(target), "◇", "purple", "across goals") + miniMetric("Still needed", formatMoney(Math.max(0, target - saved)), "→", "blue", "one step at a time") + miniMetric("Per paycheck", formatMoney(sum(goals, function (goal) { return goal.perPaycheck; })), "↗", "orange", "planned contributions") + "</div>";
    html += "<section class='content-card' style='margin-top:18px'><div class='card-title-row'><div><h3>Progress you can feel</h3><p class='subtle-note' style='margin:5px 0 0'>Add a contribution whenever money moves. No streaks, just evidence.</p></div><button class='text-button' data-action='add-goal'>＋ Add goal</button></div>" +

      }).join("") + "</div>" : emptyState("No savings goals yet. One small goal is enough to begin.", "Add savings goal", "add-goal")) +
      "</section><div class='two-column'><section class='content-card'><div class='card-title-row'><h3>How contributions work</h3><span class='badge purple'>visible</span></div><div class='setup-steps'><div class='setup-step'><div class='setup-step-number'>1</div><div><strong>Choose a target date</strong><span>The date helps estimate a contribution; it does not create pressure.</span></div></div><div class='setup-step'><div class='setup-step-number'>2</div><div><strong>Assign a per-paycheck amount</strong><span>Keep it small enough that the rest of the plan can breathe.</span></div></div><div class='setup-step'><div class='setup-step-number'>3</div><div><strong>Update when money moves</strong><span>Progress can be edited any time, including when plans change.</span></div></div></div></section><section class='content-card'><div class='card-title-row'><h3>Small milestone</h3><span class='badge green'>celebrate</span></div>" + renderMilestone() + "</section></div>";
    return html;
  }

  function debtPayoffDate(debt) {
    var balance = num(debt.balance);
    var payment = num(debt.minimum) + num(debt.extra);
    if (balance <= 0) return "Paid off";
    if (payment <= 0) return "Add a payment";
    var monthlyRate = num(debt.apr) / 100 / 12;
    var months;
    if (monthlyRate > 0 && payment > balance * monthlyRate) {
      months = Math.ceil(-Math.log(1 - (balance * monthlyRate / payment)) / Math.log(1 + monthlyRate));
    } else {
      months = Math.ceil(balance / payment);
    }
    if (!Number.isFinite(months) || months > 600) return "More than 50 years";
    return formatDate(isoDate(addMonths(todayISO(), months)), { month: "short", year: "numeric" });
  }

  function renderDebt() {
    var debts = state.debts.slice();
    var ordered = debts.slice().sort(function (a, b) {
      if (state.profile.debtMethod === "avalanche") return num(b.apr) - num(a.apr);
      return num(a.balance) - num(b.balance);
    });

    html += "<section class='content-card' style='margin-top:18px'><div class='card-title-row'><div><h3>Payoff order</h3><p class='subtle-note' style='margin:5px 0 0'>The order changes the focus, not your worth.</p></div><div class='pill-tabs'><button class='pill-tab " + (state.profile.debtMethod === "snowball" ? "active" : "") + "' data-action='debt-method' data-method='snowball'>Snowball</button><button class='pill-tab " + (state.profile.debtMethod === "avalanche" ? "active" : "") + "' data-action='debt-method' data-method='avalanche'>Avalanche</button></div></div>" +
      (ordered.length ? "<div class='table-wrap'><table class='data-table'><thead><tr><th>Order</th><th>Creditor</th><th>Balance</th><th>APR</th><th>Minimum</th><th>Due</th><th>Estimate</th><th></th></tr></thead><tbody>" + ordered.map(function (debt, index) {
        var progress = clamp((num(debt.originalBalance) - num(debt.balance)) / Math.max(1, num(debt.originalBalance)) * 100, 0, 100);

      }).join("") + "</tbody></table></div>" : emptyState("No debts listed. Add one when you are ready to make the picture clearer.", "Add debt", "add-debt")) +
      "</section><div class='two-column'><section class='content-card'><div class='card-title-row'><h3>What to pay next</h3><span class='badge amber'>suggestion</span></div>" + (ordered.length ? "<div class='milestone'><div class='milestone-icon' style='background:var(--rose)'>↘</div><div><strong>Focus extra money on " + esc(ordered[0].creditor) + "</strong><span>Keep minimums current, then send extra toward the " + (state.profile.debtMethod === "avalanche" ? "highest interest rate" : "smallest balance") + ".</span></div></div>" : emptyState("Your next debt step will appear here.")) + "</section><section class='content-card'><div class='card-title-row'><h3>Important detail</h3><span class='badge gray'>estimate</span></div><p class='subtle-note'>Payoff dates are planning estimates based on the listed balance, interest rate, minimum payment, and extra payment. Actual lender timing can differ.</p></section></div>";

  function calendarEventsForMonth(date) {
    var range = monthRange(date);
    var events = [];
    state.paychecks.filter(function (item) { var arrival = paycheckDate(item); return arrival >= range.first && arrival <= range.last && item.status !== "cancelled"; }).forEach(function (item) {
      events.push({ date: paycheckDate(item), type: "income", label: "Pay · " + formatCompactMoney(valueOfPaycheck(item)), sort: 1 });
    });
    state.bills.filter(function (item) { return item.dueDate >= range.first && item.dueDate <= range.last; }).forEach(function (item) {
      events.push({ date: item.dueDate, type: "bill", label: "Bill · " + formatCompactMoney(item.amount), sort: 2 });
    });
    state.expenses.filter(function (item) { return item.date >= range.first && item.date <= range.last; }).forEach(function (item) {
      events.push({ date: item.date, type: "expense", label: (item.name || item.category || "Spend") + " · " + formatCompactMoney(item.amount), sort: 4 });
    });
    state.debts.filter(function (item) { return item.dueDate && item.dueDate >= range.first && item.dueDate <= range.last; }).forEach(function (item) {
      events.push({ date: item.dueDate, type: "bill", label: "Debt · " + formatCompactMoney(num(item.minimum) + num(item.extra)), sort: 3 });
    });
    state.goals.forEach(function (goal) {
      state.paychecks.filter(function (item) { var arrival = paycheckDate(item); return arrival >= range.first && arrival <= range.last && item.status !== "cancelled"; }).forEach(function (item) {
        if (num(goal.perPaycheck) > 0) events.push({ date: paycheckDate(item), type: "goal", label: "Save " + formatCompactMoney(goal.perPaycheck) + " · " + goal.name, sort: 2 });
      });
    });
    return events.sort(function (a, b) { return a.date.localeCompare(b.date) || a.sort - b.sort; });
  }

  function renderCalendar() {

      (events.length ? "<div class='entity-list'>" + events.slice(0, 6).map(function (event) { return "<div class='list-item'><div class='list-icon'>" + (event.type === "income" ? "↗" : event.type === "bill" ? "✓" : "↘") + "</div><div class='list-main'><strong>" + esc(event.label) + "</strong><span>" + formatDate(event.date, { month: "short", day: "numeric" }) + "</span></div><span class='badge " + (event.type === "income" ? "green" : event.type === "bill" ? "amber" : "rose") + "'>" + (event.type === "income" ? "in" : event.type === "bill" ? "due" : "out") + "</span></div>"; }).join("") + "</div>" : emptyState("No events in this month yet.")) + "</section></div>";

  function debtPaymentsForMonth(date) {
    var range = monthRange(date);

      return sum((debt.payments || []).filter(function (payment) { return String(payment.date).slice(0, 7) === range.first.slice(0, 7); }), function (payment) { return payment.amount; });
    });
  }

      }).join("") + "</tbody></table></div>" : emptyState("Add an envelope to compare a plan with actual spending.", "Add envelope", "add-envelope")) + "</section><section class='content-card'><div class='card-title-row'><div><h3>Write one useful note</h3><p class='subtle-note' style='margin:5px 0 0'>What should next month know?</p></div><span class='badge purple'>private</span></div><form data-form='review-notes'><div class='field'><label for='reviewNote'>One adjustment or one thing that helped</label><textarea class='form-control' id='reviewNote' name='note' placeholder='e.g. Keep more fuel money in the first week...'>" + esc(note) + "</textarea></div><div class='form-actions'><button class='primary-button' type='submit'>Save review note</button></div></form><div class='milestone' style='margin-top:20px'><div class='milestone-icon'>✦</div><div><strong>Progress is not a straight line</strong><span>Use this page to make the next month kinder to the version of you who lives it.</span></div></div></section></div>";
