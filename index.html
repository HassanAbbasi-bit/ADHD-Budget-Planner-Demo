    document.getElementById("modalRoot").innerHTML = modalShell(title, subtitle, body, type === "formula" || type === "impulse" || type === "goalContribution");
  }

  function getById(list, id) {
    return (list || []).find(function (item) { return item.id === id; });
  }

  function closeModal() {
    document.getElementById("modalRoot").innerHTML = "";
  }

  function commit(message, type) {
    var snapshot = undoSnapshot;
    undoSnapshot = null;
    saveState();
    renderShell();
    if (message) showToast(message, type, snapshot);
  }

  function rememberUndo() {
    try {
      undoSnapshot = JSON.stringify(state);
    } catch (error) {
      undoSnapshot = null;
    }
  }

  function confirmDelete(message) {
    return window.confirm(message || "Remove this item?");
  }

  function downloadText(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(value) {
    var text = String(value === undefined || value === null ? "" : value);
    return "\"" + text.replace(/\"/g, "\"\"") + "\"";
  }

  function downloadBackup() {
    var backup = Object.assign({}, state, { backupVersion: 1, exportedAt: new Date().toISOString() });
    downloadText("calmpocket-backup-" + todayISO() + ".json", JSON.stringify(backup, null, 2), "application/json;charset=utf-8");
    showToast("Backup downloaded. Keep it somewhere safe.");
  }

  function downloadCsv() {
    var rows = [["Type", "Date", "Name", "Category", "Amount", "Account", "Status", "Note"]];
    state.expenses.forEach(function (item) {
      rows.push(["Expense", item.date, item.name || "", item.category || "", item.amount, accountName(item.accountId), item.recurring ? "Recurring" : "", item.note || ""]);
    });
    state.bills.forEach(function (item) {
      rows.push(["Bill", item.dueDate, item.name || "", "", item.amount, accountName(item.accountId), item.paid ? "Paid" : "Unpaid", item.notes || ""]);
    });
    state.paychecks.forEach(function (item) {
      rows.push(["Income", paycheckDate(item), item.name || "", item.kind || "Paycheck", valueOfPaycheck(item), "", item.status || "", item.source || ""]);
    });
    downloadText("calmpocket-export-" + todayISO() + ".csv", rows.map(function (row) { return row.map(csvCell).join(","); }).join("\n"), "text/csv;charset=utf-8");
    showToast("CSV export downloaded.");
  }

  function handleSubmit(event) {
    var form = event.target;
    var type = form.getAttribute("data-form");
    if (!type) return;
    if (DEMO_MODE && !form.getAttribute('data-id') && !demoCanCreate(type)) return;
    event.preventDefault();
    rememberUndo();
    var data = new FormData(form);
    var id = form.getAttribute("data-id") || "";
    var item;
    if (type === "setup") {
      var wasSample = state.profile.sampleMode;
      var setupName = String(data.get("name") || "Your calm plan").trim() || "Your calm plan";
      if (wasSample) {
        state = blankState();
        var starting = num(data.get("startingBalance"));
        if (starting > 0) state.accounts.push({ id: uid("acc"), name: "Main checking", type: "checking", balance: starting, includeInSpendable: true });
      }
      state.profile.name = setupName;
      state.profile.appName = String(data.get("appName") || "CalmPocket").trim() || "CalmPocket";
      state.profile.currency = String(data.get("currency") || "USD");
      state.profile.nextPayday = String(data.get("nextPayday") || todayISO());
      state.profile.payFrequency = String(data.get("payFrequency") || "biweekly");
      state.profile.safetyBuffer = num(data.get("safetyBuffer"));
      state.profile.mode = String(data.get("mode") || "simple");
      state.profile.sampleMode = false;
      state.ui.awayDays = 0;
      state.view = "today";
      commit("Your plan is ready. One calm number at a time.");
      closeModal();
      return;
    }
    if (type === "expense") {
      item = id ? getById(state.expenses, id) : null;
      var expense = item || { id: uid("exp") };
      expense.amount = num(data.get("amount"));
      expense.category = String(data.get("category") || "Other");
      expense.name = String(data.get("name") || expense.category).trim() || expense.category;
      expense.date = String(data.get("date") || todayISO());
      expense.accountId = String(data.get("accountId") || "");
      expense.paymentMethod = String(data.get("paymentMethod") || "Other");
      expense.note = String(data.get("note") || "").trim();
      expense.recurring = data.get("recurring") === "on";
      if (!item) state.expenses.push(expense);
      if (form.getAttribute("data-brain-id")) {
        var brainResolved = getById(state.brainDump, form.getAttribute("data-brain-id"));
        if (brainResolved) brainResolved.done = true;
      }
      commit("Spending saved. You can keep moving.");
      closeModal();
      return;
    }
    if (type === "brain-inline" || type === "brain") {
      var textValue = String(data.get("text") || "").trim();
      if (textValue) state.brainDump.unshift({ id: uid("brain"), text: textValue, createdAt: todayISO(), done: false });
      commit("Saved to Brain dump.");
      if (type === "brain") closeModal();
      return;
    }
    if (type === "bill") {
      item = id ? getById(state.bills, id) : null;
      var bill = item || { id: uid("bill") };
      bill.name = String(data.get("name") || "Bill").trim() || "Bill";
      bill.amount = num(data.get("amount"));
      bill.dueDate = String(data.get("dueDate") || todayISO());
      bill.frequency = String(data.get("frequency") || "monthly");
      bill.accountId = String(data.get("accountId") || "");
      bill.notes = String(data.get("notes") || "").trim();
      bill.autopay = data.get("autopay") === "on";
      bill.setAside = data.get("setAside") === "on";
      bill.paid = data.get("paid") === "on";
      if (!item) state.bills.push(bill);
      commit("Bill saved.");
      closeModal();
      return;
    }
    if (type === "paycheck") {
      item = id ? getById(state.paychecks, id) : null;
      var paycheck = item || { id: uid("pay") };
      paycheck.name = String(data.get("name") || "Paycheck").trim() || "Paycheck";
      paycheck.source = String(data.get("source") || "Income").trim() || "Income";
      paycheck.expected = num(data.get("expected"));
      paycheck.amount = paycheck.expected;
      paycheck.actual = num(data.get("actual"));
      paycheck.date = String(data.get("date") || todayISO());
      paycheck.earlyPayDays = num(data.get("earlyPayDays"));
      paycheck.flexibleAmount = num(data.get("flexibleAmount"));
      paycheck.frequency = String(data.get("frequency") || state.profile.payFrequency);
      paycheck.kind = String(data.get("kind") || "paycheck");
      paycheck.status = String(data.get("status") || (paycheck.actual > 0 ? "received" : "upcoming"));
      if (paycheck.actual > 0) paycheck.status = "received";
      paycheck.recurring = data.get("recurring") === "on";
      if (!item) state.paychecks.push(paycheck);
      if (paycheck.date === state.profile.nextPayday) state.profile.nextPayday = paycheck.date;
      commit("Paycheck saved.");
      closeModal();
      return;
    }
    if (type === "envelope") {
      item = id ? getById(state.envelopes, id) : null;
      var envelope = item || { id: uid("env") };
      envelope.name = String(data.get("name") || "Category").trim() || "Category";
      envelope.limit = num(data.get("limit"));
      envelope.reserved = num(data.get("reserved"));
      envelope.icon = String(data.get("icon") || categoryIcon(envelope.name));
      if (!item) state.envelopes.push(envelope);
      commit("Envelope saved.");
      closeModal();
      return;
    }
    if (type === "goal") {
      item = id ? getById(state.goals, id) : null;
      var goal = item || { id: uid("goal") };
      goal.name = String(data.get("name") || "Savings goal").trim() || "Savings goal";
      goal.target = num(data.get("target"));
      goal.saved = num(data.get("saved"));
      goal.targetDate = String(data.get("targetDate") || isoDate(addMonths(todayISO(), 6)));
      goal.perPaycheck = num(data.get("perPaycheck"));
      goal.icon = String(data.get("icon") || "◎");
      if (!item) state.goals.push(goal);
      commit("Savings goal saved.");
      closeModal();
      return;
    }
    if (type === "goal-contribution") {
      var contributionGoal = getById(state.goals, id);
      if (contributionGoal) {
        contributionGoal.saved = num(contributionGoal.saved) + num(data.get("amount"));
        contributionGoal.contributions = contributionGoal.contributions || [];
        contributionGoal.contributions.push({ id: uid("contribution"), amount: num(data.get("amount")), date: String(data.get("date") || todayISO()), note: String(data.get("note") || "") });
      }
      commit("Contribution added. That is progress you can see.");
      closeModal();
      return;
    }
    if (type === "debt") {
      item = id ? getById(state.debts, id) : null;
      var debt = item || { id: uid("debt"), payments: [] };
      debt.creditor = String(data.get("creditor") || "Debt").trim() || "Debt";
      debt.balance = num(data.get("balance"));
      debt.originalBalance = num(data.get("originalBalance")) || debt.balance;
      debt.apr = num(data.get("apr"));
      debt.minimum = num(data.get("minimum"));
      debt.dueDate = String(data.get("dueDate") || todayISO());
      debt.extra = num(data.get("extra"));
      debt.method = String(data.get("method") || state.profile.debtMethod);
      debt.payments = debt.payments || [];
      if (!item) state.debts.push(debt);
      commit("Debt saved.");
      closeModal();
      return;
    }
    if (type === "debt-payment") {
      var debtItem = getById(state.debts, id);
      if (debtItem) {
        var paymentAmount = Math.min(num(data.get("amount")), num(debtItem.balance));
        debtItem.balance = Math.max(0, num(debtItem.balance) - paymentAmount);
        debtItem.payments = debtItem.payments || [];
        debtItem.payments.push({ id: uid("debt-payment"), amount: paymentAmount, date: String(data.get("date") || todayISO()), note: String(data.get("note") || "") });
      }
      commit("Debt payment logged.");
      closeModal();
      return;
    }
    if (type === "account") {
      item = id ? getById(state.accounts, id) : null;
      var account = item || { id: uid("acc") };
      account.name = String(data.get("name") || "Account").trim() || "Account";
      account.type = String(data.get("type") || "checking");
      account.balance = num(data.get("balance"));
      account.includeInSpendable = data.get("includeInSpendable") === "on" && account.type !== "credit";
      if (!item) state.accounts.push(account);
      commit("Account saved.");
      closeModal();
      return;
    }
    if (type === "impulse") {
      state.impulses.unshift({ id: uid("impulse"), item: String(data.get("item") || "Want").trim() || "Want", amount: num(data.get("amount")), createdAt: todayISO(), waitHours: num(data.get("waitHours")) || 24, status: "waiting" });
      commit("Impulse pause started.");
      closeModal();
      return;
    }
    if (type === "review-notes") {
      var monthKey = state.ui.reviewMonth || todayISO().slice(0, 7);
      state.reviewNotes[monthKey] = String(data.get("note") || "").trim();
      commit("Review note saved.");
      return;
    }
    if (type === "settings-profile") {
      state.profile.name = String(data.get("name") || "Your calm plan").trim() || "Your calm plan";
      state.profile.appName = String(data.get("appName") || "CalmPocket").trim() || "CalmPocket";
      state.profile.currency = String(data.get("currency") || "USD");
      state.profile.payFrequency = String(data.get("payFrequency") || "biweekly");
      state.profile.nextPayday = String(data.get("nextPayday") || todayISO());
      state.profile.safetyBuffer = num(data.get("safetyBuffer"));
      commit("Settings saved.");
      return;
    }
  }

  function removeById(list, id) {
    var index = list.findIndex(function (item) { return item.id === id; });
    if (index >= 0) list.splice(index, 1);
  }

  function handleClick(event) {
    if (event.target.classList && event.target.classList.contains("modal-backdrop")) {
      closeModal();
      return;
    }
    var viewButton = event.target.closest ? event.target.closest("[data-view]") : null;
    if (viewButton && !event.target.closest("[data-action]")) {
      state.view = viewButton.getAttribute("data-view");
      saveState();
      renderShell();
      document.getElementById("sidebar").classList.remove("open");
      return;
    }
    var button = event.target.closest ? event.target.closest("[data-action]") : null;
    if (!button) return;
    var action = button.getAttribute("data-action");
    if (DEMO_MODE && (action === "export-csv" || action === "export-json" || action === "restore-json" || action === "enable-reminders" || action === "toggle-dark" || action === "dark-mode")) {
      demoUpgradePopup("This premium feature is locked in the free demo. Purchase to unlock more features.");
      return;
    }
    if (action === "undo") {
      var undoId = button.getAttribute("data-undo-id");
      var undoValue = undoId ? undoSnapshots[undoId] : null;
      if (undoValue) {
        try {
          state = mergeState(JSON.parse(undoValue));
          delete undoSnapshots[undoId];
          commit("Last change undone.");
        } catch (error) {
          delete undoSnapshots[undoId];
          showToast("The last change could not be undone.", "warning");
        }
      }
      return;
    }
    if (action === "close-modal") {
      if (button.classList.contains("modal-backdrop") && event.target !== button) return;
      closeModal();
      return;
    }
    if (action === "load-sample") {
      var hasPersonalData = state.accounts.length || state.paychecks.length || state.bills.length ||
        state.expenses.length || state.envelopes.length || state.goals.length || state.debts.length ||
        state.brainDump.length || state.impulses.length;
      if (hasPersonalData && !confirmDelete("Load the sample plan? This replaces the current planner data. Download a backup first if you want to keep it.")) return;
      rememberUndo();
      state = sampleState();
      state.profile.sampleMode = true;
      state.view = "today";
      state.lastOpened = todayISO();
      commit("Sample plan loaded. You can replace it with your own numbers.");
      return;
    }
    if (action === "setup") return renderModal("setup");
    if (action === "formula") return renderModal("formula");
    if (action === "add-expense") return renderModal("expense");
    if (action === "quick-expense") return renderModal("expense", { amount: button.getAttribute("data-amount") });
    if (action === "add-brain") return renderModal("brain");
    if (action === "add-bill") return renderModal("bill");
    if (action === "add-paycheck") return renderModal("paycheck");
    if (action === "add-envelope") return renderModal("envelope");
    if (action === "add-envelope-name") return renderModal("envelope", { name: button.getAttribute("data-name") });
    if (action === "add-goal") return renderModal("goal");
    if (action === "add-debt") return renderModal("debt");
    if (action === "add-account") return renderModal("account");
    if (action === "add-impulse") return renderModal("impulse");
    if (action === "edit-expense") return renderModal("expense", { item: getById(state.expenses, button.getAttribute("data-id")) });
    if (action === "edit-bill") return renderModal("bill", { item: getById(state.bills, button.getAttribute("data-id")) });
    if (action === "edit-paycheck") return renderModal("paycheck", { item: getById(state.paychecks, button.getAttribute("data-id")) });
    if (action === "edit-envelope") return renderModal("envelope", { item: getById(state.envelopes, button.getAttribute("data-id")) });
    if (action === "edit-goal") return renderModal("goal", { item: getById(state.goals, button.getAttribute("data-id")) });
    if (action === "edit-debt") return renderModal("debt", { item: getById(state.debts, button.getAttribute("data-id")) });
    if (action === "edit-account") return renderModal("account", { item: getById(state.accounts, button.getAttribute("data-id")) });
    if (action === "add-debt-payment") return renderModal("debtPayment", { item: getById(state.debts, button.getAttribute("data-id")) });
    if (action === "contribute-goal") return renderModal("goalContribution", { item: getById(state.goals, button.getAttribute("data-id")) });
    if (action === "done-brain") {
      rememberUndo();
      var doneItem = getById(state.brainDump, button.getAttribute("data-id"));
      if (doneItem) doneItem.done = true;
      return commit("Brain dump item marked done.");
    }
    if (action === "delete-brain") {
      if (confirmDelete("Remove this Brain dump item?")) { rememberUndo(); removeById(state.brainDump, button.getAttribute("data-id")); commit("Brain dump item removed."); }
      return;
    }
    if (action === "resolve-brain") {
      var resolveItem = getById(state.brainDump, button.getAttribute("data-id"));
      if (resolveItem) renderModal("expense", { item: { name: "", category: "Other", date: todayISO(), note: resolveItem.text, accountId: state.accounts[0] ? state.accounts[0].id : "", paymentMethod: "Other", recurring: false }, brainId: resolveItem.id });
      return;
    }
    if (action === "delete-expense") {
      if (confirmDelete("Remove this spending entry?")) { rememberUndo(); removeById(state.expenses, button.getAttribute("data-id")); commit("Spending entry removed."); }
      return;
    }
    if (action === "delete-bill") {
      if (confirmDelete("Remove this bill?")) { rememberUndo(); removeById(state.bills, button.getAttribute("data-id")); commit("Bill removed."); }
      return;
    }
    if (action === "delete-envelope") {
      if (confirmDelete("Remove this envelope?")) { rememberUndo(); removeById(state.envelopes, button.getAttribute("data-id")); commit("Envelope removed."); }
      return;
    }
    if (action === "delete-goal") {
      if (confirmDelete("Remove this savings goal?")) { rememberUndo(); removeById(state.goals, button.getAttribute("data-id")); commit("Savings goal removed."); }
      return;
    }
    if (action === "delete-debt") {
      if (confirmDelete("Remove this debt from the planner?")) { rememberUndo(); removeById(state.debts, button.getAttribute("data-id")); commit("Debt removed."); }
      return;
    }
    if (action === "delete-account") {
      if (confirmDelete("Remove this account?")) { rememberUndo(); removeById(state.accounts, button.getAttribute("data-id")); commit("Account removed."); }
      return;
    }
    if (action === "pay-bill" || action === "unpay-bill") {
      rememberUndo();
      var billItem = getById(state.bills, button.getAttribute("data-id"));
      if (billItem) billItem.paid = action === "pay-bill";
      return commit(action === "pay-bill" ? "Bill marked paid." : "Bill moved back to upcoming.");
    }
    if (action === "impulse-buy" || action === "impulse-dismiss") {
      rememberUndo();
      var impulse = getById(state.impulses, button.getAttribute("data-id"));
      if (impulse) impulse.status = action === "impulse-buy" ? "purchased" : "dismissed";
      return commit(action === "impulse-buy" ? "Purchase marked as decided." : "Want dismissed. Good information either way.");
    }
    if (action === "debt-method") {
      rememberUndo();
      state.profile.debtMethod = button.getAttribute("data-method") || "snowball";
      return commit("Payoff method updated.");
    }
    if (action === "mode-simple" || action === "mode-everything") {
      rememberUndo();
      state.profile.mode = action === "mode-simple" ? "simple" : "everything";
      return commit(state.profile.mode === "simple" ? "Simple mode on." : "Everything mode on.");
    }
    if (action === "theme-light" || action === "theme-dark") {
      rememberUndo();
      state.profile.theme = action === "theme-dark" ? "dark" : "light";
      return commit("Theme updated.");
    }
    if (action === "open-focus") {
      state.ui.focusMode = true;
      saveState();
      renderShell();
      return;
    }
    if (action === "close-focus") {
      state.ui.focusMode = false;
      saveState();
      renderShell();
      return;
    }
    if (action === "catch-up") {
      rememberUndo();
      state.ui.awayDays = 0;
      state.lastOpened = todayISO();
      state.view = "today";
      commit("Welcome back. Your plan is still here.");
      return;
    }
    if (action === "show-everything") {
      rememberUndo();
      state.profile.mode = "everything";
      return commit("Everything mode on. More tools are visible now.");
    }
    if (action === "calendar-prev" || action === "calendar-next") {
      monthCursor = addMonths(monthCursor, action === "calendar-prev" ? -1 : 1);
      renderShell();
      return;
    }
    if (action === "calendar-today") {
      monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      renderShell();
      return;
    }
    if (action === "review-prev" || action === "review-next") {
      var reviewDate = addMonths((state.ui.reviewMonth || todayISO().slice(0, 7)) + "-01", action === "review-prev" ? -1 : 1);
      state.ui.reviewMonth = isoDate(reviewDate).slice(0, 7);
      saveState();
      renderShell();
      return;
    }
    if (action === "review-today") {
      state.ui.reviewMonth = todayISO().slice(0, 7);
      saveState();
      renderShell();
      return;
    }
    if (action === "backup-json") return downloadBackup();
    if (action === "restore-json") return document.getElementById("restoreInput").click();
    if (action === "export-csv") return downloadCsv();
    if (action === "clear-sample") {
      if (confirmDelete("Remove the sample data and return to an empty plan?")) {
        rememberUndo();
        state = blankState();
        state.view = "start";
        commit("Sample data removed. Your plan is empty.");
      }
      return;
    }
    if (action === "start-fresh") {
      if (confirmDelete("Start with an empty plan? Download a backup first if you want to keep these numbers.")) {
        rememberUndo();
        state = blankState();
        state.view = "start";
        commit("A fresh, empty plan is ready.");
      }
      return;
    }
  }

  function setupEvents() {
    document.addEventListener("click", handleClick);
    document.addEventListener("submit", handleSubmit);
    document.getElementById("focusButton").addEventListener("click", function () {
      state.ui.focusMode = true;
      saveState();
      renderShell();
    });
    document.getElementById("globalAdd").addEventListener("click", function () { renderModal("expense"); });
    document.getElementById("menuToggle").addEventListener("click", function () { document.getElementById("sidebar").classList.add("open"); });
    document.getElementById("sidebarClose").addEventListener("click", function () { document.getElementById("sidebar").classList.remove("open"); });
    document.getElementById("restoreInput").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          state = mergeState(JSON.parse(reader.result));
          state.profile.sampleMode = false;
          state.lastOpened = todayISO();
          state.ui.awayDays = 0;
          saveState();
          renderShell();
          showToast("Backup restored.");
        } catch (error) {
          showToast("That backup could not be read. Nothing was changed.", "warning");
        }
        event.target.value = "";
      };
      reader.readAsText(file);
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (state.ui.focusMode) {
          state.ui.focusMode = false;
          saveState();
          renderShell();
        } else {
          closeModal();
        }
      }
    });
  }

  setupEvents();
  renderShell();

  window.Calmpocket = {
    getState: function () { return state; },
    render: renderShell
  };
})();
